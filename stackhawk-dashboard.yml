# HawkScan, surface 2 of 3: the office dashboard.
#
# The target is a private copy of the dashboard's build, served on this machine the way Vercel
# serves the real one, at https://127.0.0.1:4444 (scripts/security-scan/sites). It calls the
# local copy of the server and no other. Nothing live is ever scanned.
# scripts/security-scan/README.md says how to start everything and run the scan.
#
# The dashboard is a single-page app. It keeps its session in the browser's own storage, which
# the scanner cannot fill, so the crawl sees the sign-in screen at every address and nothing
# behind it. What a signed-in supervisor can do is tested where it is decided, on the server
# (stackhawk-api.yml). This scan covers how the dashboard is served: its response headers, its
# files, and the sign-in screen.
#
# Assumed, with nobody to ask when this was written:
# - Routes expected: the build's 15 files, and the app itself at any other address, since the
#   live site rewrites every path to it. A crawl that is not signed in can reach 11 of the 15 at
#   most: not the two source maps (named only in a comment at the end of a script), not
#   fonts/OFL.txt (linked from nowhere), and not the logoArt script (loaded only for a company
#   with the traced logo, behind the sign-in).
# - The crawl's browser stays on this machine. The copy's links to the live sites and to Stripe
#   are moved onto the copies when it is made (scripts/security-scan/sites/stage.mjs), and the
#   scanner and its browser are run through scripts/security-scan/egress-guard.mjs, which lets
#   them reach StackHawk and the scan targets on 127.0.0.1 and nothing else.

app:
  applicationId: ${APP_ID}
  env: ${APP_ENV:Development-dashboard}
  host: ${APP_HOST:https://127.0.0.1:4444}

hawk:
  # Any finding ends the scan with exit code 42.
  failureThreshold: low
  # The scan guard (scripts/security-scan/egress-guard.mjs), for both of the scanning engine's
  # ways out. hawk.outboundProxy is what its sign-in and its calls to StackHawk use. The three
  # network.connection.httpProxy lines are what its crawl, its attacks and what it fetches for its
  # browser use. The guard passes StackHawk and the three scan targets on 127.0.0.1, and refuses
  # everything else. Seen on this machine: the sign-in, the engine and its browser all reach
  # 127.0.0.1 through the guard, and the guard refuses localhost, so name every target 127.0.0.1.
  outboundProxy:
    host: ${SCAN_OUTBOUND_PROXY}
  config:
    - network.connection.httpProxy.enabled=true
    - network.connection.httpProxy.host=${SCAN_GUARD_HOST}
    - network.connection.httpProxy.port=${SCAN_GUARD_PORT}
  spider:
    base: true
    # The pages are drawn by JavaScript, so the crawl needs a browser.
    ajax: true
    ajaxBrowser: CHROME_HEADLESS
    maxDurationMinutes: 3
    # Every address is the same app, so nothing links to these: a page, pages that read the
    # query, and the trial link from the website.
    seedPaths:
      - /roster
      - /records?day=2026-11-18
      - /requests?show=open
      - /billing?started=1
      - /?start=trial

tags:
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
  - name: git_origin
    value: biipn/us-mine-payroll-app
