<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--page-->
<title>Mine Muster 3D Logo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&display=swap">
<style>
  /* Layout: one full-bleed black stage; the logo is the page, controls sit quietly on the bottom edge. */
  :root {
    color-scheme: dark;
    --stage: #000000;
    --stage-glow: #14161b;
    --steel: #d9dde3;
    --steel-dim: #8b919b;
    --line: #2a2d34;
    --panel: #0b0c0fcc;
    --font-ui: "Chakra Petch", "Eurostile", "Segoe UI", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: radial-gradient(ellipse 70% 55% at 50% 46%, var(--stage-glow) 0%, var(--stage) 70%) var(--stage);
    color: var(--steel); font-family: var(--font-ui);
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #stage:focus-visible { box-shadow: inset 0 0 0 1px var(--steel-dim); }

  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding-block: 0 calc(18px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .hint {
    margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--steel-dim); text-align: center;
  }
  .controls {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    padding: 6px; border: 1px solid var(--line); background: var(--panel);
    backdrop-filter: blur(8px); pointer-events: auto;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .controls button {
    appearance: none; border: 1px solid transparent; background: transparent; color: var(--steel-dim);
    font: 600 11px/1 var(--font-ui); letter-spacing: 0.18em; text-transform: uppercase;
    padding: 10px 14px; cursor: pointer; transition: color .15s, border-color .15s, background .15s;
  }
  .controls button:hover { color: var(--steel); }
  .controls button:focus-visible { outline: 1px solid var(--steel); outline-offset: 1px; }
  .controls button[aria-pressed="true"] { color: var(--stage); background: var(--steel); }
  .sep { width: 1px; background: var(--line); margin: 4px 2px; }
  body.embed .hud { display: none; }
  body.embed { background: transparent; }
  .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--steel-dim); }
  @media (max-width: 520px) { .controls button { padding: 9px 10px; letter-spacing: 0.12em; } .sep { display: none; } }
  @media (prefers-reduced-motion: reduce) { .controls button { transition: none; } }
</style>
<!--/page-->
</head>
<body>
<!--page-->
<canvas id="stage" tabindex="0" aria-label="Mine Muster logo in 3D. Drag to rotate, scroll to zoom, arrow keys to turn."></canvas>

<div class="hud">
  <p class="hint">Drag to rotate · Scroll or pinch to zoom · Double-tap to reset</p>
  <div class="controls" role="toolbar" aria-label="Logo view">
    <button type="button" id="view-front" data-view="front">Front</button>
    <button type="button" id="view-hero" data-view="hero">Angle</button>
    <button type="button" id="view-side" data-view="side">Side</button>
    <button type="button" id="view-top" data-view="top">Top</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="toggle-spin" aria-pressed="true">Spin</button>
    <button type="button" id="toggle-word" aria-pressed="true">Wordmark</button>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
  import { mountLogo } from './logo3d.js';

  // ?embed hides the controls and makes the background transparent, for dropping into another page via <iframe>.
  const embed = new URLSearchParams(location.search).has('embed');
  document.body.classList.toggle('embed', embed);

  try {
    const logo = mountLogo(document.getElementById('stage'), { transparent: embed });
    document.querySelectorAll('[data-view]').forEach((b) =>
      b.addEventListener('click', () => logo.setView(b.dataset.view)));
    const spin = document.getElementById('toggle-spin');
    spin.setAttribute('aria-pressed', String(logo.autoRotate));
    spin.addEventListener('click', () => {
      logo.setAutoRotate(!logo.autoRotate);
      spin.setAttribute('aria-pressed', String(logo.autoRotate));
    });
    const word = document.getElementById('toggle-word');
    word.addEventListener('click', () => {
      logo.setWordmark(!logo.wordmark);
      word.setAttribute('aria-pressed', String(logo.wordmark));
    });
    window.mineMusterLogo = logo;
  } catch (err) {
    console.error(err);
    const p = document.createElement('p');
    p.className = 'fallback';
    p.textContent = 'This browser could not start 3D graphics. Turn on hardware acceleration or try another browser.';
    document.body.append(p);
  }
</script>
<!--/page-->
</body>
</html>
